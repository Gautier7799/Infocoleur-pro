name: Build Android APK (Pixel Color & Torch Notification)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Build APK with Jetpack Compose
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle 8.7 (Compatible with AGP 8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 🔐 Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 🏗️ Build Debug APK with Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: 📦 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-ColorNotification-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (Optional on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            ## 🎨 Pixel Smart Color & Torch Notification - APK
            - وميض الشاشة الذكي الملون حسب كل تطبيق (واتساب أخضر، تيليجرام أزرق...)
            - وميض فلاش الكاميرا الخلفي (Lampe Torche) متزامن مع اللون
            - دعم إطار الحواف المنحنية (Edge Lighting) والشاشة كاملة
            - متوافق مع هواتف Pixel وأندرويد 14 / 15 / 16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
