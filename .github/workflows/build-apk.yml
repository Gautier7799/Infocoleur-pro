name: Build Android APK (Pixel Light Notification)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # زر التشغيل اليدوي بنقرة واحدة من Actions في GitHub

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Build APK with Jetpack Compose
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Java 17 for Android 14/15/16/17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 🔐 Setup Gradle Wrapper & Executable Permissions
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew || true

      - name: 🏗️ Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-ColorNotification-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (Optional on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 Pixel Color Light Notification - إصدار APK
            - مبني تلقائياً عبر GitHub Actions 🚀
            - متوافق مع Android 14 / 15 / 16 / 17
            - يدعم إشعارات الفلاش وإضاءة الحواف بالألوان المدمجة في النظام
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
