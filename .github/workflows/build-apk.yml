name: Build Android APK (Pixel Light Notification)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بزر Run workflow بنقرة واحدة من لوحة Actions في GitHub!

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Build APK with Jetpack Compose
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Java 17 for Android 14/15/16/17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK & Build Environment
        uses: android-actions/setup-android@v3

      - name: 🔐 Ensure gradlew permissions
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not present, setting up default Gradle..."
            gradle wrapper || true
            chmod +x gradlew || true
          fi

      - name: 🏗️ Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 📦 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel8-LightNotification-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 🏷️ Create GitHub Release (Optional on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 Pixel 8 Light Notification - إصدار APK
            - مبني تلقائياً عبر GitHub Actions 🚀
            - متوافق مع Android 14 / 15 / 16 / 17
            - يدعم إشعارات الفلاش الخلفية وإضاءة الحواف وويدجت Glance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
